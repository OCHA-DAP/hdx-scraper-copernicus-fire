# Collector specific configuration
base_url: "https://maps.effis.emergency.copernicus.eu"
bbox: "-180.0,-90.0,180.0,90.0" # Global extent
width: 3600
height: 1800

datasets:
  fire_forecast:
    name: "copernicus-fire-danger-forecast"
    title: "Fire Danger Forecast"
    notes: |-
      The fire danger forecast provides daily fire danger indices. The continuous raster
      GeoTIFFs in this dataset are from the ECMWF (~8 km) and NASA Geos-5 (~28 km) models.

      The Fire Weather Index (FWI) is computed from the ECMWF and NASA Geos-5 models.
      The FWI is mapped in 6 classes: low, medium, high, very high, extreme and very extreme.
      The "Very Extreme" class was introduced in June 2021 to discriminate against
      extensive areas initially classified at "Extreme" in the Mediterranean region
      during summer months, and includes areas with FWI values above 70.
    resource_name: "copernicus_fire_danger"
    method: "wms"
    format: "image/tiff"
    ext: "geotiff"
    forecast: true
    days: 1
    tags: [ "climate hazards", "forecasting", "hazards and risk" ]
    showcase:
      notes: "Interactive map showing ECMWF Fire Weather Index (FWI) forecast"
      image_url: "https://forest-fire.emergency.copernicus.eu/static/assets/images/effis.apps.csv.png"
    layers:
      ecmwf_fwi:
        endpoint: "gwis"
        layer: "ecmwf.fwi"
        description: "ECMWF Fire Weather Index (FWI)"
      nasa_geos5_fwi:
        endpoint: "gwis"
        layer: "nasa_geos5.fwi"
        description: "NASA Geos-5 Fire Weather Index (FWI)"
      ecmwf_isi:
        endpoint: "gwis"
        layer: "ecmwf.isi"
        description: "ECMWF Initial Spread Index (ISI)"
      nasa_geos5_isi:
        endpoint: "gwis"
        layer: "nasa_geos5.isi"
        description: "NASA Geos-5 Initial Spread Index (ISI)"
      ecmwf_bui:
        endpoint: "gwis"
        layer: "ecmwf.bui"
        description: "ECMWF Build Up Index (BUI)"
      nasa_geos5_bui:
        endpoint: "gwis"
        layer: "nasa_geos5.bui"
        description: "NASA Geos-5 Build Up Index (BUI)"
      ecmwf_ffmc:
        endpoint: "gwis"
        layer: "ecmwf.ffmc"
        description: "ECMWF Fine Fuel Moisture Code (FFMC)"
      nasa_geos5_ffmc:
        endpoint: "gwis"
        layer: "nasa_geos5.ffmc"
        description: "NASA Geos-5 Fine Fuel Moisture Code (FFMC)"
      ecmwf_dmc:
        endpoint: "gwis"
        layer: "ecmwf.dmc"
        description: "ECMWF Duff Moisture Code (DMC)"
      nasa_geos5_dmc:
        endpoint: "gwis"
        layer: "nasa_geos5.dmc"
        description: "NASA Geos-5 Duff Moisture Code (DMC)"
      ecmwf_dc:
        endpoint: "gwis"
        layer: "ecmwf.dc"
        description: "ECMWF Drought Code (DC)"
      nasa_geos5_dc:
        endpoint: "gwis"
        layer: "nasa_geos5.dc"
        description: "NASA Geos-5 Drought Code (DC)"
      ecmwf_anomaly:
        endpoint: "gwis"
        layer: "ecmwf.anomaly"
        description: "ECMWF Anomaly"
      ecmwf_ranking:
        endpoint: "gwis"
        layer: "ecmwf.ranking"
        description: "ECMWF Ranking"
      ecmwf_kbdi:
        endpoint: "gwis"
        layer: "ecmwf.mark5.kbdi"
        description: "ECMWF Keetch-Byron Drought Index (KBDI)"
      ecmwf_mark5_df:
        endpoint: "gwis"
        layer: "ecmwf.mark5.df"
        description: "ECMWF MARK-5 Drought Factor (DF)"
      ecmwf_mark5_ros:
        endpoint: "gwis"
        layer: "ecmwf.mark5.ros"
        description: "ECMWF MARK-5 Rate of Spread (ROS)"
      ecmwf_mark5_fdi:
        endpoint: "gwis"
        layer: "ecmwf.mark5.fdi"
        description: "ECMWF MARK-5 Fire Danger Index (FDI)"
      ecmwf_nfdrs_ros:
        endpoint: "gwis"
        layer: "ecmwf.nfdrs.ros"
        description: "ECMWF NFDRS Rate of Spread (ROS)"
      ecmwf_nfdrs_sc:
        endpoint: "gwis"
        layer: "ecmwf.nfdrs.sc"
        description: "ECMWF NFDRS Spread Component (SC)"
      ecmwf_nfdrs_erc:
        endpoint: "gwis"
        layer: "ecmwf.nfdrs.erc"
        description: "ECMWF NFDRS Energy Release Component (ERC)"
      ecmwf_nfdrs_bi:
        endpoint: "gwis"
        layer: "ecmwf.nfdrs.bi"
        description: "ECMWF NFDRS Burning Index (BI)"
      ecmwf_nfdrs_ic:
        endpoint: "gwis"
        layer: "ecmwf.nfdrs.ic"
        description: "ECMWF NFDRS Ignition Probability (IC)"
      ecmwf_extra_lightning:
        endpoint: "gwis"
        layer: "ecmwf.extra.lightning"
        description: "Lightning Forecast"

  burnt_area:
    name: "copernicus-burnt-areas"
    title: "Burnt Areas (MODIS)"
    notes: |-
      Global burned area polygons derived from MODIS satellite imagery, providing
      information on spatial and temporal attributes of areas affected by fires.
      Fires are mapped using a semi-automatic procedure. Provided as GeoJSON.

      Note: the dates reported as Start date and Last update may not correspond to the
      date of ignition and extinction of the fire.
    resource_name: "copernicus_burnt_areas"
    method: "wfs"
    format: "geojson"
    ext: "geojson"
    forecast: false
    days: [ 1, 7, 30 ]
    tags: [ "climate hazards", "damage assessment", "hazards and risk" ]
    layers:
      modis:
        endpoint: "effis"
        layer: "ms:modis.ba.poly"
        description: "MODIS Burnt Area Polygons"

  fire_emissions:
    name: "copernicus-fire-emissions"
    title: "Fire Emissions (CAMS-GFAS)"
    notes: |-
      The CAMS Global Fire Assimilation System (GFAS) utilises satellite observations of
      fire radiative power (FRP) to provide near-real-time information on the location,
      relative intensity and estimated emissions from biomass burning and vegetation
      fires.

      Emissions are estimated by conversion of FRP observations to the dry matter (DM)
      consumed by the fire, and application of emission factors to DM for different
      biomes, based on field and laboratory studies. Provided as continuous raster GeoTIFFs.
    resource_name: "copernicus_fire_emissions"
    method: "wms"
    format: "image/tiff"
    ext: "geotiff"
    forecast: false
    days: 7
    tags: [ "climate hazards", "environment" ]
    layers:
      gfas_bc:
        endpoint: "gwis"
        layer: "gfas.bc"
        description: "Emissions of Black Carbon (BC)"
      gfas_ch4:
        endpoint: "gwis"
        layer: "gfas.ch4"
        description: "Emissions of Methane (CH4)"
      gfas_co2:
        endpoint: "gwis"
        layer: "gfas.co2"
        description: "Emissions of Carbon Dioxide (CO2)"
      gfas_co:
        endpoint: "gwis"
        layer: "gfas.co"
        description: "Emissions of Carbon monoxide (CO)"
      gfas_c:
        endpoint: "gwis"
        layer: "gfas.c"
        description: "Emissions of Burnt Carbon (C)"
      gfas_nmhc:
        endpoint: "gwis"
        layer: "gfas.nmhc"
        description: "Emissions of Non-Methane Hydro-Carbons (NMHC)"
      gfas_nox:
        endpoint: "gwis"
        layer: "gfas.nox"
        description: "Emissions of Nitrogen Oxides (NOx)"
      gfas_oc:
        endpoint: "gwis"
        layer: "gfas.oc"
        description: "Emissions of Organic Carbon (OC)"
      gfas_pm2p5:
        endpoint: "gwis"
        layer: "gfas.pm2p5"
        description: "Emissions of Particulate Matter (PM2.5)"
      gfas_so2:
        endpoint: "gwis"
        layer: "gfas.so2"
        description: "Emissions of Sulfur Dioxide (SO2)"
      gfas_tc:
        endpoint: "gwis"
        layer: "gfas.tc"
        description: "Emissions of Total Carbon in Aerosols (TC)"
